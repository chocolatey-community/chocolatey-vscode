name: Release

# Replaces the retired AppVeyor pipeline.  The Cake AppVeyor target
# itself (from Cake.VsCode.Recipe) decides whether to actually publish
# based on GitVersion output and the branch name; pushes to develop
# build + test, pushes to master / release/* / hotfix/* publish.
#
# Secrets expected (configure in repo Settings -> Secrets and variables
# -> Actions):
#   VSMARKETPLACE_TOKEN  - Personal Access Token for the Visual Studio
#                          Marketplace publisher.
#   CHOCOLATEY_API_KEY   - API key for chocolatey.org.
#   GITHUB_PAT           - Optional PAT with `repo` scope for creating
#                          GitHub Releases.  Falls back to the default
#                          GITHUB_TOKEN, which works for most flows.

on:
  push:
    branches:
      - master
      - "release/**"
      - "hotfix/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # GitVersion in the Cake recipe needs full git history.
          fetch-depth: 0

      - name: Install dotnet #needed for GitVersion
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309
        with:
          dotnet-version: |
            5.0.x

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cake AppVeyor target
        run: .\build.ps1 --target=AppVeyor --verbosity=Diagnostic
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}
          VSMARKETPLACE_TOKEN: ${{ secrets.VSMARKETPLACE_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
