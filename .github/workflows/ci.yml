name: CI

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2
        with:
          # GitVersion inside the Cake recipe needs full git history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"
          cache: npm

      # Cake 0.32 (the version pinned in tools/packages.config) runs on
      # the .NET Framework via mono on Linux / macOS.  GitHub runners
      # don't ship mono by default.  xvfb is needed on Linux so the VS
      # Code test-electron host has a virtual display.
      - name: Install mono + xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete xvfb

      - name: Install mono (macOS)
        if: runner.os == 'macOS'
        run: brew install mono

      # Cache the restored Cake tools directory so repeat runs skip the
      # NuGet round-trip.  Keyed on recipe.cake + tools/packages.config
      # so any recipe version change invalidates the cache.
      - name: Cache Cake tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: tools
          key: ${{ runner.os }}-cake-${{ hashFiles('recipe.cake', 'tools/packages.config') }}

      # Cache the VS Code instance that @vscode/test-electron downloads for
      # the integration tests.  Without this, every CI run hits
      # update.code.visualstudio.com/api/releases/stable, which is
      # heavily rate-limited from GitHub Actions IP pools and frequently
      # returns HTML instead of JSON ("Failed to parse response ... as JSON").
      # Keyed on the pinned VS Code version in src/test/runTest.ts so a bump
      # there invalidates the cache automatically.
      - name: Cache VS Code test host
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test-${{ hashFiles('src/test/runTest.ts') }}

      - name: Install dotnet #needed for GitVersion
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309
        with:
          dotnet-version: |
            5.0.x

      - name: Run Cake Test target (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build.ps1 --target=Test --verbosity=Diagnostic

      - name: Run Cake Test target (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build.sh --target=Test --verbosity=Diagnostic

      - name: Run Cake Test target (macOS)
        if: runner.os == 'macOS'
        run: ./build.sh --target=Test --verbosity=Diagnostic

      - name: Upload bundled extension as artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-bundle
          path: out/extension.js
          if-no-files-found: warn
          retention-days: 14
